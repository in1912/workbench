services:
  workbench:
    build: .
    container_name: quan-ge-workbench
    # 开机自启：Docker 服务启动时自动拉起容器（Windows Docker Desktop / 群晖 Container Manager 均生效）
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TZ=Asia/Shanghai
      - DATA_DIR=/data
      # 容器内固定库文件名（容器环境无宿主写保护，无需每次重建新库）
      - DB_FILE=qg-final.sqlite
    volumes:
      # 数据持久化：SQLite 数据库存放在宿主机 data/ 目录
      - ./data:/data
      # ── 下面 7 条是「宿主同路径」挂载（2026-10-02 新增）─────────────────────
      # 写法统一为 宿主路径:容器同路径（左右完全一样），于是容器里看到的路径
      # 就等于宿主机文件管理器里的路径，应用设置里可直接填宿主真实绝对路径
      # （例如 vc_root=/vol1/1000/视频），不必再给每个目录另起短名做映射。
      # 为什么必须同路径、不能用 /mail2、/学习2 这类短名：vol1 与 vol2 下有同名
      # 目录（mail、学习），而一个容器路径只能对应一个宿主目录，短名会互相覆盖。
      # ⚠️ 换机器部署先改这里：下面是飞牛 fnOS 的默认卷路径（vol1/vol2 + 用户
      #    uid 1000），其它环境要按实际目录改。**目标机上目录不存在时 Docker
      #    不报错，而是悄悄建一个空目录**——容器里就会出现看着正常、实则空白的
      #    目录，很难查；部署前务必确认这些路径真实存在，并按需增删。
      # 读写权限：容器内进程以 root 运行，这几条 bind mount 默认可读可写；但
      #    容器新建的文件属主是 root，在宿主机文件管理器/SMB 里可能显示为 root
      #    或需要提权才能改名删除，介意的目录请在宿主机侧调整属主。
      - /vol2/1000/mail:/vol2/1000/mail
      - /vol2/1000/学习:/vol2/1000/学习
      - /vol1/1000/mail:/vol1/1000/mail
      - /vol1/1000/学习:/vol1/1000/学习
      - /vol1/1000/视频:/vol1/1000/视频
      # 邮件附件目录 ALL：上面的父目录已经包含它，再单独挂一次是冗余保险——
      # 2026-10-01 出过「父挂载从 yml 里消失、附件目录在容器里突然不存在」的
      # 事故，多挂一条能扛住父挂载日后被误删。
      - /vol2/1000/mail/ALL:/vol2/1000/mail/ALL
      - /vol1/1000/mail/ALL:/vol1/1000/mail/ALL
